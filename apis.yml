name: Course Hero
description: >-
  Course Hero is an online learning platform where students and educators access
  more than 25 million course-specific study resources — practice problems, study
  guides, class notes, step-by-step explanations, essays, and lab reports —
  alongside 24/7 tutoring and AI-assisted study tools. Founded in 2006 by Andrew
  Grauer at Cornell University and headquartered in Redwood City, California,
  Course Hero is part of Learneo, a family of learning and productivity brands that
  also includes QuillBot, Symbolab, LitCharts, CliffsNotes, Scribbr, Bartleby, and
  LanguageTool. Course Hero exposes only internal, undocumented web APIs (under
  /api/) that power its consumer web and mobile apps; it publishes no public
  developer program, OpenAPI specification, SDKs, or partner API. This profile was
  surfaced as a portfolio company of D1 Capital, Sierra Ventures, and SV Angel.
